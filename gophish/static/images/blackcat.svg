<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Black Cat logo">
  <defs>
    <radialGradient id="bcBody" cx="50%" cy="38%" r="72%">
      <stop offset="0%" stop-color="#2b3a67"/>
      <stop offset="55%" stop-color="#141d38"/>
      <stop offset="100%" stop-color="#05070f"/>
    </radialGradient>
    <radialGradient id="bcEye" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e8feff"/>
      <stop offset="45%" stop-color="#4CC9F0"/>
      <stop offset="100%" stop-color="#0e7ea6"/>
    </radialGradient>
    <filter id="bcGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- ears + head silhouette -->
  <path fill="url(#bcBody)" stroke="#4CC9F0" stroke-opacity="0.35" stroke-width="2"
        d="M20 58 L14 18 L44 36
           C52 30 76 30 84 36 L114 18 L108 58
           C112 74 106 96 88 106
           C72 115 56 115 40 106
           C22 96 16 74 20 58 Z"/>
  <!-- inner ears -->
  <path fill="#7209B7" fill-opacity="0.55"
        d="M22 52 L19 28 L38 39 Z M106 52 L109 28 L90 39 Z"/>
  <!-- glowing eyes -->
  <g filter="url(#bcGlow)">
    <ellipse cx="46" cy="70" rx="11" ry="12.5" fill="url(#bcEye)"/>
    <ellipse cx="82" cy="70" rx="11" ry="12.5" fill="url(#bcEye)"/>
    <ellipse cx="46" cy="70" rx="3.4" ry="8.5" fill="#06121f"/>
    <ellipse cx="82" cy="70" rx="3.4" ry="8.5" fill="#06121f"/>
    <circle cx="49" cy="65" r="2.2" fill="#ffffff" opacity="0.9"/>
    <circle cx="85" cy="65" r="2.2" fill="#ffffff" opacity="0.9"/>
  </g>
  <!-- nose + whiskers -->
  <path fill="#4CC9F0" opacity="0.9" d="M61 88 L67 88 L64 92 Z"/>
  <g stroke="#8b98b8" stroke-width="1.6" stroke-linecap="round" opacity="0.85">
    <line x1="30" y1="88" x2="52" y2="90"/>
    <line x1="30" y1="96" x2="52" y2="93"/>
    <line x1="98" y1="88" x2="76" y2="90"/>
    <line x1="98" y1="96" x2="76" y2="93"/>
  </g>
</svg>
